<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>PNotas - Herramienta para estudiantes</title>
    <link rel="stylesheet" type="text/css" href="estilo.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="motor.js" defer></script>
</head>
<body>

    <!-- ============================================================= -->
    <!--  BARRA DE NAVEGACION (logo + boton de modo claro/oscuro)      -->
    <!-- ============================================================= -->
    <nav class="navbar">
        <ul>
            <li><img src="media/logo.png" alt="PNotas" class="logoImg"></li>
            <li>
                <button id="cambiarModo" aria-label="Cambiar modo claro u oscuro">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#1f1f1f"><path d="M480-120q-150 0-255-105T120-480q0-150 105-255t255-105q14 0 27.5 1t26.5 3q-41 29-65.5 75.5T444-660q0 90 63 153t153 63q55 0 101-24.5t75-65.5q2 13 3 26.5t1 27.5q0 150-105 255T480-120Z"/></svg>
                    <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#1f1f1f"><path d="M565-395q35-35 35-85t-35-85q-35-35-85-35t-85 35q-35 35-35 85t35 85q35 35 85 35t85-35Zm-226.5 56.5Q280-397 280-480t58.5-141.5Q397-680 480-680t141.5 58.5Q680-563 680-480t-58.5 141.5Q563-280 480-280t-141.5-58.5ZM200-440H40v-80h160v80Zm720 0H760v-80h160v80ZM440-760v-160h80v160h-80Zm0 720v-160h80v160h-80ZM256-650l-101-97 57-59 96 100-52 56Zm492 496-97-101 53-55 101 97-57 59Zm-98-550 97-101 59 57-100 96-56-52ZM154-212l101-97 55 53-97 101-59-57Zm326-268Z"/></svg>
                </button>
            </li>
        </ul>
    </nav>

    <!-- ============================================================= -->
    <!--  VISTA 1: INICIAR SESION                                      -->
    <!-- ============================================================= -->
    <section id="vistaLogin" class="inFlex">
        <div class="glassContainer">
            <h1 class="titulo">Iniciar Sesion</h1>
            <input type="email" class="email" placeholder="Correo electronico">
            <input type="password" class="psw" placeholder="Contraseña">
            <input type="button" value="Iniciar sesion" class="btnIniciarSesion" id="btnIniciarSesion">
        </div>
    </section>

    <!-- ============================================================= -->
    <!--  VISTA 2: PANEL PRINCIPAL DE NOTAS                            -->
    <!-- ============================================================= -->
    <section id="vistaPanel" class="panel oculto">

        <!-- Encabezado del panel: titulo + boton nueva nota -->
        <header class="panelHeader">
            <h1 class="titulo panelTitulo">Mis Notas</h1>
            <button id="btnNuevaNota" class="btnAccion">+ Nueva nota</button>
        </header>

        <!-- Mensaje cuando no hay ninguna nota todavia -->
        <p id="mensajeVacio" class="mensajeVacio">Todavia no tienes notas. Crea tu primera nota con el boton "Nueva nota".</p>

        <!-- Contenedor donde se pintan las tarjetas de notas -->
        <div id="listaNotas" class="listaNotas"></div>
    </section>

    <!-- ============================================================= -->
    <!--  MODAL: CREAR / EDITAR NOTA                                   -->
    <!-- ============================================================= -->
    <div id="modalNota" class="modalFondo oculto">
        <div class="glassContainer modalCaja">
            <h2 class="titulo modalTitulo" id="modalTitulo">Nueva nota</h2>

            <input type="text" id="inputTitulo" class="email inputModal" placeholder="Titulo de la nota">
            <textarea id="inputContenido" class="areaModal" placeholder="Escribe aqui tu nota..."></textarea>

            <div class="modalBotones">
                <button id="btnGuardarNota" class="btnAccion">Guardar</button>
                <button id="btnCancelarNota" class="btnSecundario">Cancelar</button>
            </div>
        </div>
    </div>

</body>
</html>
